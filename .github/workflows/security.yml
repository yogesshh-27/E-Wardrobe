name: Security & Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-gate:
    name: DevSecOps Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint & Type Checks
        run: npm run lint

      - name: Run Comprehensive Security Tests
        run: npm run security:test

      - name: Trivy Filesystem, Dependency & Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Build Next.js Production Artifact
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build Docker Container
        run: docker build -t wardrobe-ai:latest -f Dockerfile .
        continue-on-error: true

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'wardrobe-ai:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Setup Python for Strix
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Strix Agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx install strix-agent

      - name: Strix Automated White-Box Penetration Test
        if: env.LLM_API_KEY != ''
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
        run: |
          strix -n -t ./ --scan-mode quick --max-budget 10
